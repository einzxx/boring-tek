<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>head flap</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// head flap. tap or space to fly. one file, no libraries.
// the world is 1080 by 1920 units, scaled to fit the screen.
const W = 1080, H = 1920;
const GREEN = '#3dff6e';
const STEP = 1 / 60;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');

const P = {
  gravity: 3400, flap: -1250, maxFall: 1900,
  speed: 430, gap: 520, barW: 170, spacing: 640,
  headX: 330, headR: 78,
};

// seeded random so a run can be replayed exactly
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

let s;
function reset(n) {
  if (n != null) seed = n;
  s = { mode: 'ready', t: 0, y: H * 0.45, vy: 0, bars: [], score: 0, best: s ? s.best : 0,
        dead: 0, blink: 0, shake: 0, pop: 0 };
  for (let i = 0; i < 4; i++) addBar(W + 260 + i * P.spacing);
}
function addBar(x) {
  const top = 330 + rand() * (H - 660 - P.gap);
  s.bars.push({ x, top, passed: false });
}

function flap() {
  if (s.mode === 'over') { if (s.dead > 0.6) reset(); return; }
  if (s.mode === 'ready') s.mode = 'play';
  s.vy = P.flap;
  s.blink = 0.12;
}

function hit(b) {
  const r = P.headR * 0.86;
  if (P.headX + r < b.x || P.headX - r > b.x + P.barW) return false;
  return s.y - r < b.top || s.y + r > b.top + P.gap;
}

function step() {
  s.t += STEP;
  s.blink = Math.max(0, s.blink - STEP);
  s.shake = Math.max(0, s.shake - STEP * 2.5);
  s.pop = Math.max(0, s.pop - STEP * 4);
  if (s.mode === 'ready') { s.y = H * 0.45 + Math.sin(s.t * 3) * 26; return; }
  if (s.mode === 'over') {
    s.dead += STEP;
    if (s.y < H - P.headR) { s.vy = Math.min(s.vy + P.gravity * STEP, P.maxFall); s.y = Math.min(H - P.headR, s.y + s.vy * STEP); }
    return;
  }
  s.vy = Math.min(s.vy + P.gravity * STEP, P.maxFall);
  s.y += s.vy * STEP;
  for (const b of s.bars) {
    b.x -= P.speed * STEP;
    if (!b.passed && b.x + P.barW < P.headX) { b.passed = true; s.score++; s.pop = 1; }
  }
  if (s.bars[0].x + P.barW < -40) { s.bars.shift(); addBar(s.bars[s.bars.length - 1].x + P.spacing); }
  if (s.y - P.headR < 0 || s.y + P.headR > H || s.bars.some(hit)) die();
}
function die() {
  s.mode = 'over'; s.dead = 0; s.shake = 1; s.vy = -500;
  s.best = Math.max(s.best, s.score);
}

function glowRect(x, y, w, h) {
  cx.save();
  cx.shadowColor = GREEN;
  for (const [blur, a] of [[90, 0.5], [40, 0.7], [14, 1]]) {
    cx.shadowBlur = blur; cx.globalAlpha = a;
    cx.fillStyle = GREEN; cx.fillRect(x, y, w, h);
  }
  cx.restore();
  cx.fillStyle = '#c9ffd8';
  cx.fillRect(x + w * 0.42, y, w * 0.16, h);
}

function head(x, y, tilt) {
  const r = P.headR;
  cx.save();
  cx.translate(x, y); cx.rotate(tilt);
  // the deep glow, three soft white layers under the head
  cx.shadowColor = '#ffffff';
  for (const [blur, a] of [[140, 0.55], [70, 0.7], [26, 0.9]]) {
    cx.shadowBlur = blur; cx.globalAlpha = a;
    cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.fillStyle = '#f4f7f5'; cx.fill();
  }
  cx.shadowBlur = 0; cx.globalAlpha = 1;
  cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.fillStyle = '#f4f7f5'; cx.fill();
  // eyes, the mascot's two pills, squint on a flap, flat when he is out
  const k = r / 30, eh = s.mode === 'over' ? 2.2 : s.blink > 0 ? 2.4 : 4.4;
  cx.fillStyle = '#06070a';
  for (const ex of [-17, 4]) {
    pill(ex * k, (38.5 - 32 - eh / 2) * k, 13 * k, eh * k);
  }
  cx.restore();
}
function pill(x, y, w, h) {
  const rr = h / 2;
  cx.beginPath();
  cx.moveTo(x + rr, y); cx.lineTo(x + w - rr, y); cx.arc(x + w - rr, y + rr, rr, -Math.PI / 2, Math.PI / 2);
  cx.lineTo(x + rr, y + h); cx.arc(x + rr, y + rr, rr, Math.PI / 2, Math.PI * 1.5); cx.fill();
}

function text(str, x, y, size, color, glow) {
  cx.save();
  cx.font = `700 ${size}px ui-monospace,Menlo,Consolas,monospace`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (glow) { cx.shadowColor = color; cx.shadowBlur = glow; }
  cx.fillStyle = color; cx.fillText(str, x, y);
  cx.restore();
}

function draw() {
  const sc = Math.max(cv.width / W, cv.height / H);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
  const sh = s.shake * s.shake * 34;
  cx.setTransform(sc, 0, 0, sc, (cv.width - W * sc) / 2 + (Math.random() - 0.5) * sh, (cv.height - H * sc) / 2 + (Math.random() - 0.5) * sh);
  for (const b of s.bars) {
    glowRect(b.x, -20, P.barW, b.top + 20);
    glowRect(b.x, b.top + P.gap, P.barW, H - b.top - P.gap + 20);
  }
  const tilt = s.mode === 'ready' ? 0 : Math.max(-0.45, Math.min(1.2, s.vy / 1600));
  head(P.headX, s.y, tilt);
  if (s.mode !== 'ready') text(String(s.score), W / 2, 230, 180 + s.pop * 50, '#ffffff', 40);
  if (s.mode === 'ready') { text('head flap', W / 2, 520, 120, GREEN, 50); text('tap or space', W / 2, 1380, 56, '#ffffff', 0); }
  if (s.mode === 'over') {
    const a = Math.min(1, s.dead * 3);
    cx.globalAlpha = a * 0.6; cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); cx.globalAlpha = a;
    text('game over', W / 2, 760, 140, GREEN, 60);
    text('score ' + s.score + '   best ' + s.best, W / 2, 920, 60, '#ffffff', 0);
    if (s.dead > 0.6) text('tap to try again', W / 2, 1060, 52, '#ffffff', 0);
    cx.globalAlpha = 1;
  }
}

function fit() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
}
addEventListener('resize', fit);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });
addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

fit(); reset();
// a fixed step loop, so the game plays the same at any frame rate.
// ?manual hands the clock to a script: window.headflap.tick() advances one frame.
const manual = new URLSearchParams(location.search).has('manual');
window.headflap = { flap, reset, tick() { step(); draw(); }, get state() { return s; }, P };
if (!manual) {
  let last = performance.now(), acc = 0;
  (function loop(now) {
    acc = Math.min(0.25, acc + (now - last) / 1000); last = now;
    while (acc >= STEP) { step(); acc -= STEP; }
    draw(); requestAnimationFrame(loop);
  })(last);
} else draw();
</script>
</body>
</html>
