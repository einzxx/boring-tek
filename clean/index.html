  gap:clamp(12px,2.6vh,22px);

  position:absolute; left:0; right:0; top:-24px; height:24px;
  pointer-events:none; opacity:0;

    rgba(53,255,106,0) 100%);
}
.scan::after{

  background:var(--accent);
}
.zone.busy .scan{animation:scan .95s var(--ease) 1 both}
@keyframes scan{

/* mascot, the site's: halo on a wrapper, eyes on css variables. */

.mascot{position:relative;display:block;width:clamp(92px,22vw,110px);height:auto}

/* neither control wraps its own words: the button drops to a second line as

/* the button in the middle, the link at the right edge: three columns, the

.row .btn{grid-column:2;white-space:nowrap;font-weight:400;padding:8px 16px;min-height:36px}
.row .lnk{grid-column:3;justify-self:end;margin-left:0}
.btn{
  appearance:none;cursor:pointer;font:inherit;font-size:var(--t-micro);

  letter-spacing:.1em;text-transform:uppercase;
  padding:12px 22px;min-height:44px;

}
.btn:hover{background:var(--fg);color:var(--bg)}

/* the result block: hidden until there is a result, then the card's own

.res{
  display:grid; grid-template-rows:0fr; opacity:0;
  transition:grid-template-rows .44s var(--ease),opacity .3s ease-out;
}

function found(parts,verb){ return fmt(t('found'),{list:list(parts),verb:t(verb)}); }
function cleanName(name,ext){
  var base=(name||'file').replace(/\.[^.]+$/,'');
  return base+'.clean.'+ext;
}
function breakdown(c){
  var out=[],n,k;
  for(n=0;n<TYPES.length;n++){ k=TYPES[n]; if(c[k]) out.push(t('l_'+k)+' '+c[k]); }
  return out.join(', ');
}
function metaBreakdown(b){
  var out=[];
  if(b.exif) out.push('exif '+b.exif);
  if(b.xmp) out.push('xmp '+b.xmp);
  if(b.icc) out.push(t('m_icc'));
  if(b.c2pa) out.push(t('m_c2pa'));
  if(b.iptc) out.push('iptc '+b.iptc);
  if(b.text) out.push(t('m_text')+' '+b.text);
  if(b.comment) out.push(t('m_comment')+' '+b.comment);
  if(b.time) out.push(t('m_time'));
  return out.join(', ');
}
function verbFor(c,removedToo){
  var removed=(c.zero+c.soft+c.dir+c.vs+c.tag+c.sep)>0||removedToo;
  var replaced=(c.sp+c.punct)>0;
  return removed&&replaced ? 'v_fixed' : replaced ? 'v_replaced' : 'v_removed';
}

/* ---------- the cleaners. each returns {line, sub, blob?, name?, text?} ---------- */
/* curly quotes and long dashes always come out as plain ones */
var plain=true;
var lastText=null;

function textResult(str,name){
  var r=cleanText(str,plain), out={};
  if(!r.total){
    out.line=t('clean_none');
    out.sub='';
  }else{
    var parts=[];
    if(r.hidden) parts.push(phrase(r.hidden,'n_hidden'));
    if(r.counts.sp) parts.push(phrase(r.counts.sp,'n_space'));
    if(r.counts.punct) parts.push(phrase(r.counts.punct,'n_curly'));
    out.line=found(parts,'v_removed');
    out.sub=breakdown(r.counts);
  }
  if(name){
    if(!r.total) return out;
    out.blob=new Blob([r.text],{type:'text/plain;charset=utf-8'});
    out.name=cleanName(name,(name.match(/\.([^.]+)$/)||[0,'txt'])[1]);
  }else{
    out.text=r.text;
    /* the cleaner run once more over its own output, and the count it finds
       said out loud. it is zero by construction, and saying so is the point. */
    out.left=cleanText(r.text,plain).total;
  }
  return out;
}

function bitmap(file){
  if(window.createImageBitmap){
    return createImageBitmap(file,{imageOrientation:'from-image'})
      .catch(function(){ return createImageBitmap(file); });
  }
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(url); res(im); };
    im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src=url;
  });
}
function imageResult(kind,u8,file){
  var mime={png:'image/png',jpeg:'image/jpeg',webp:'image/webp'}[kind];
  var bag=imageMeta(kind,u8);
  return bitmap(file).then(function(bm){
    var w=bm.width||bm.naturalWidth, h=bm.height||bm.naturalHeight;
    var c=D.createElement('canvas'); c.width=w; c.height=h;
    var cx=c.getContext('2d');
    if(!cx) throw new Error('canvas');
    cx.drawImage(bm,0,0);
    if(bm.close) bm.close();
    return new Promise(function(res,rej){
      c.toBlob(function(b){ b ? res(b) : rej(new Error('encode')); },mime,.95);
    });
  }).then(function(blob){
    return blob.arrayBuffer().then(function(ab){
      var out={}, outKind=blob.type==='image/png' ? 'png' : blob.type==='image/jpeg' ? 'jpeg' : blob.type==='image/webp' ? 'webp' : kind;
      var bytes=new Uint8Array(ab);
      if(outKind==='jpeg') bytes=stripJpeg(bytes);
      else if(outKind==='webp') bytes=stripWebp(bytes);
      var left=metaTotal(imageMeta(outKind,bytes));
      var total=metaTotal(bag), notes=[];
      if(total){
        out.line=found([phrase(total,'n_tag')],'v_removed');
        notes.push(metaBreakdown(bag));
      }else{
        out.line=t('clean_none');
        notes.push(t('reenc'));
      }
      notes.push(left ? fmt(t('chk_left'),{n:left}) : t('chk_ok'));
      if(outKind!==kind) notes.push(fmt(t('saved_as'),{a:outKind,b:kind}));
      out.sub=notes.join('. ');
      out.blob=new Blob([bytes],{type:blob.type});
      out.name=cleanName(file.name,{png:'png',jpeg:'jpg',webp:'webp'}[outKind]);
      return out;
    });
  });
}

function pdfResult(u8,file){
  return lib('pdf').then(function(P){
    return P.PDFDocument.load(u8,{updateMetadata:false}).catch(function(e){
      throw new Error(/encrypt/i.test(String(e&&e.message)) ? 'locked' : 'badpdf');
    }).then(function(doc){
      var ctx=doc.context, fields=0, xmp=0, info, keys, n, ref, st, bytes;
      ref=ctx.trailerInfo.Info;
      if(ref){
        info=ctx.lookup(ref);
        if(info&&info.keys){
          keys=info.keys();
          for(n=0;n<keys.length;n++){ fields++; info.delete(keys[n]); }
        }
      }
      ref=doc.catalog.get(P.PDFName.of('Metadata'));
      if(ref){
        try{
          st=ctx.lookup(ref);
          bytes = st instanceof P.PDFRawStream ? P.decodePDFRawStream(st).decode() : null;
          xmp = bytes ? xmpCount(utf8(bytes,0,bytes.length)) : 1;
        }catch(e){ xmp=1; }
        doc.catalog.delete(P.PDFName.of('Metadata'));
        /* unlinking is not enough: the writer serialises every object it
           knows, so the orphaned stream would still ship in the file */
        if(ref instanceof P.PDFRef) ctx.delete(ref);
      }
      return doc.save({updateFieldAppearances:false}).then(function(saved){
        var out={}, total=fields+xmp, notes=[];
        if(total){
          out.line=found([phrase(total,'n_tag')],'v_removed');
          if(fields) notes.push(t('info_fields')+' '+fields);
          if(xmp) notes.push('xmp '+xmp);
          out.sub=notes.join(', ');
          out.blob=new Blob([saved],{type:'application/pdf'});
          out.name=cleanName(file.name,'pdf');
        }else{
          out.line=t('clean_none');
          out.sub='';
        }
        return out;
      });
    });
  });
}

function blankCore(xml){
  var n=0;
  xml=xml.replace(/<(dcterms:(?:created|modified))(\s[^>]*)?>[^<]*<\/\1>/g,function(){ n++; return ''; });
  xml=xml.replace(/<((?:cp|dc):[A-Za-z]+)(\s[^>]*)?>([^<]+)<\/\1>/g,function(m,tag,attr,txt){
    if(!txt.trim()) return m;
    n++; return '<'+tag+(attr||'')+'></'+tag+'>';
  });
  return {xml:xml,n:n};
}
function blankApp(xml){
  var n=0;
  xml=xml.replace(/<([A-Za-z]+(?::[A-Za-z0-9]+)?)(\s[^>]*)?>([^<]+)<\/\1>/g,function(m,tag,attr,txt){
    var v=txt.trim(), to;
    if(!v||v==='true'||v==='false') return m;
    if(/^\d+$/.test(v)) to='0';
    else if(/^\d+\.\d{4}$/.test(v)) to='0.0000';
    else to='';
    n++; return '<'+tag+(attr||'')+'>'+to+'</'+tag+'>';
  });
  return {xml:xml,n:n};
}
function decodeNum(txt){
  return txt.replace(/&#(\d+);|&#x([0-9a-fA-F]+);/g,function(m,d,h){
    var cp=d ? parseInt(d,10) : parseInt(h,16);
    if(!(cp>=0x80&&cp<=0x10FFFF)) return m;
    try{ return String.fromCodePoint(cp); }catch(e){ return m; }
  });
}
function docxResult(file){
  var Z, zip, counts=zeroCounts(), meta=0;
  return lib('zip').then(function(z){ Z=z; return Z.loadAsync(file); }).then(function(z){
    zip=z;
    if(!zip.file('word/document.xml')) throw new Error('other');
    var parts=[], props=[], thumbs=[];
    zip.forEach(function(p){
      if(/^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(p)) parts.push(p);
      else if(/^docProps\/(core|app|custom)\.xml$/.test(p)) props.push(p);
      else if(/^docProps\/thumbnail\./i.test(p)) thumbs.push(p);
    });
    var jobs=parts.map(function(p){
      return zip.file(p).async('string').then(function(xml){
        var out=xml.replace(/<w:t(\s[^>]*)?>([^<]*)<\/w:t>/g,function(m,attr,txt){
          var dec=decodeNum(txt), r=cleanText(dec,plain);
          addCounts(counts,r.counts);
          if(r.text===dec) return m;
          attr=attr||'';
          if(attr.indexOf('xml:space')<0) attr+=' xml:space="preserve"';
          return '<w:t'+attr+'>'+r.text+'</w:t>';
        });
        if(out!==xml) zip.file(p,out);
      });
    });
    jobs=jobs.concat(props.map(function(p){
      return zip.file(p).async('string').then(function(xml){
        var r = /core\.xml$/.test(p) ? blankCore(xml) : blankApp(xml);
        meta+=r.n;
        if(r.xml!==xml) zip.file(p,r.xml);
      });
    }));
    if(thumbs.length){
      thumbs.forEach(function(p){ zip.remove(p); meta++; });
      if(zip.file('_rels/.rels')) jobs.push(zip.file('_rels/.rels').async('string').then(function(xml){
        var out=xml.replace(/<Relationship\b[^>]*thumbnail[^>]*?(?:\/>|>\s*<\/Relationship>)/gi,'');
        if(out!==xml) zip.file('_rels/.rels',out);
      }));
    }
    return Promise.all(jobs);
  }).then(function(){
    /* every part's own timestamp is a mark too */
    var stamp=new Date(1980,0,1);
    zip.forEach(function(p,f){ f.date=stamp; });
    return zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      compression:'DEFLATE'
    });
  }).then(function(blob){
    var out={}, hidden=counts.zero+counts.soft+counts.dir+counts.vs+counts.tag+counts.sep;
    var total=hidden+counts.sp+counts.punct+meta, parts=[], notes=[];
    if(!total){ out.line=t('clean_none'); out.sub=''; return out; }
    if(hidden) parts.push(phrase(hidden,'n_hidden'));
    if(counts.sp) parts.push(phrase(counts.sp,'n_space'));
    if(counts.punct) parts.push(phrase(counts.punct,'n_curly'));
    if(meta) parts.push(phrase(meta,'n_field'));
    out.line=found(parts,verbFor(counts,meta>0));
    if(hidden||counts.sp||counts.punct) notes.push(breakdown(counts));
    if(meta) notes.push(t('docprops')+' '+meta);
    out.sub=notes.join(', ');
    out.blob=blob;
    out.name=cleanName(file.name,'docx');
    return out;
  });
}

function cleanFile(file){
  return file.arrayBuffer().then(function(ab){
    var u8=new Uint8Array(ab), kind=sniff(u8,file);
    if(kind==='text') return textResult(decodeText(u8),file.name);
    if(kind==='png'||kind==='jpeg'||kind==='webp') return imageResult(kind,u8,file);
    if(kind==='pdf') return pdfResult(u8,file);
    if(kind==='docx'||kind==='zip') return docxResult(file);
    throw new Error('other');
  });
}
var ERR={other:'e_other',nolib:'e_nolib',locked:'e_locked',badpdf:'e_badpdf',decode:'e_decode',encode:'e_encode',canvas:'e_canvas'};

/* ---------- the flow ---------- */
var SCAN=950, url=null, running=false;
/* one press: the text field and, if a file is waiting in the zone, the file
   too, over one scan. pressing again simply runs again. */
function take(txt,file){
  if(running) return;
  running=true; busy=true;
  lastText=null;
  calmEyes();
  zone.classList.remove('over');
  zone.classList.add('busy');
  if(card.classList.contains('on')) hideCard();
  var jobs=[];
  if(txt) jobs.push(Promise.resolve().then(function(){ return {text:textResult(txt)}; }));
  else clearText();
  if(file) jobs.push(cleanFile(file).then(function(r){ return {file:r}; },function(e){ return {fileErr:e}; }));
  Promise.all([Promise.all(jobs), RUN ? wait(SCAN) : wait(0)]).then(function(rs){
    zone.classList.remove('busy');
    busy=false; running=false;
    rs[0].forEach(function(r){
      if(r.text){ lastText=txt; showText(r.text); }
      else if(r.file) showCard(r.file);
      else if(r.fileErr){
        var code=r.fileErr&&r.fileErr.message;
        showCard({line:t(ERR[code]||ERR.other), sub: (!ERR[code]||code==='other') ? t('supported') : '', bad:true});
      }
    });
  });
}
/* a dropped or picked file waits in the zone, named, until the button. */
function stage(file){
  if(!file) return;
  staged=file;
  fnameEl.textContent=fmt(t('ready'),{name:file.name||'file'});
  fnameEl.hidden=false;
  fileIn.value='';
}

function copyText(str){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(str);
  return new Promise(function(res,rej){
    var ta=D.createElement('textarea');
    ta.value=str; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px';
    D.body.appendChild(ta); ta.select();
    var ok=false;
    try{ ok=D.execCommand('copy'); }catch(e){}
    D.body.removeChild(ta);
    ok ? res() : rej(new Error('copy'));
  });
}

function showCard(r){
  if(url){ URL.revokeObjectURL(url); url=null; }
  pad.textContent='';
  var s=el('div','step'), b, a;
  s.appendChild(el('p', r.bad ? 'q bad' : 'q', r.line));
  if(r.sub) s.appendChild(el('p','qs',r.sub));
  if(r.blob){
    url=URL.createObjectURL(r.blob);
    b=el('button','big',t('dl')); b.type='button';
    b.addEventListener('click',function(){
      a=D.createElement('a'); a.href=url; a.download=r.name||'clean';
      D.body.appendChild(a); a.click(); D.body.removeChild(a);
    });
    s.appendChild(b);
  }
  pad.appendChild(s);
  card.classList.remove('off');
  nextPaint(function(){
    card.classList.add('on');
    /* the zone is tall on purpose, so the card can land under the fold */
    try{ card.scrollIntoView({behavior: RUN ? 'smooth' : 'auto', block:'nearest'}); }catch(e){}
  });
}
/* the right column: the clean text, the check line over the copy button, and
   the button comes alive. */
function showText(r){
  outEl.value=r.text;
  chkEl.textContent=r.line+' '+fmt(t('checked'),{left:phrase(r.left,'n_left')});
  chkEl.hidden=false;
  cpBtn.disabled=false;
  res.classList.remove('off');
  nextPaint(function(){
    res.classList.add('on');
    try{ res.scrollIntoView({behavior: RUN ? 'smooth' : 'auto', block:'nearest'}); }catch(e){}
  });
}
function clearText(){
  outEl.value=''; chkEl.hidden=true; chkEl.textContent='';
  cpBtn.disabled=true; cpTxt.textContent=t('cp');
  if(cpTimer){ clearTimeout(cpTimer); cpTimer=0; }
  res.classList.remove('on');
  setTimeout(function(){ if(!res.classList.contains('on')) res.classList.add('off'); },320);
}
cpBtn.addEventListener('click',function(){
  if(cpBtn.disabled||!outEl.value) return;
  copyText(outEl.value).then(function(){
    cpTxt.textContent=t('copied');
    if(cpTimer) clearTimeout(cpTimer);
    cpTimer=setTimeout(function(){ cpTxt.textContent=t('cp'); cpTimer=0; },2000);
  },function(){ cpTxt.textContent=t('nocopy'); });
});
function hideCard(){
  card.classList.remove('on');
  setTimeout(function(){ if(!card.classList.contains('on')){ card.classList.add('off'); pad.textContent=''; } },320);
}
/* clear all: both fields, the check line, the file in the zone, the card. */
function clearAll(){
  if(running) return;
  lastText=null; staged=null;
  fnameEl.hidden=true; fnameEl.textContent='';
  fileIn.value=''; inEl.value='';
  clearText();
  if(card.classList.contains('on')) hideCard();
  if(url){ setTimeout(function(){ if(url){ URL.revokeObjectURL(url); url=null; } },400); }
  try{ inEl.focus({preventScroll:true}); }catch(e){}
}
D.querySelector('.clr').addEventListener('click',clearAll);
/* ---------- inputs: the zone for files, the field for text, one link ---------- */
runBtn.addEventListener('click',function(){
  if(running) return;
  var txt=inEl.value.trim() ? inEl.value : '';
  if(!txt&&!staged){
    clearText();
    chkEl.textContent=t('e_empty'); chkEl.hidden=false;
    inEl.focus();
    return;
  }
  take(txt,staged);
});
inEl.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runBtn.click(); }
});
zone.addEventListener('click',function(){ if(!running) fileIn.click(); });
zone.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!running) fileIn.click(); }
});
fileIn.addEventListener('change',function(){
  if(fileIn.files&&fileIn.files[0]) stage(fileIn.files[0]);
});
/* the whole document is the target. a drop outside the zone must not navigate
   the tab to the file, so every dragover is claimed. */
var overN=0;
D.addEventListener('dragenter',function(e){ e.preventDefault(); overN++; zone.classList.add('over'); });
D.addEventListener('dragover',function(e){ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy'; });
D.addEventListener('dragleave',function(){ overN--; if(overN<=0){ overN=0; zone.classList.remove('over'); } });
D.addEventListener('drop',function(e){
  e.preventDefault(); overN=0; zone.classList.remove('over');
  var dt=e.dataTransfer; if(!dt) return;
  if(dt.files&&dt.files.length) stage(dt.files[0]);
});
}

if(D.readyState==='loading') D.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
